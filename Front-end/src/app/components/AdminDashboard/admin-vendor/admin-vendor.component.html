<!-- Header -->
<app-header></app-header>

<!-- Sidebar -->
<app-sidebar></app-sidebar>

<!-- Main Content -->
<div class="main-content">
    <!-- Search Bar and Add Vendor Button -->
    <div class="search-add-container">
        <input type="text" class="search-bar" placeholder="Search Vendor" />
        <button class="add-vendor-button" (click)="openAddVendorForm()">
            Add New Vendor
        </button>
    </div>

    <!-- Vendor Table -->
    <table class="vendor-table">
        <thead>
            <tr>
                <th>Vendor ID</th>
                <th>Name</th>
                <th>GST No</th>
                <th>Address</th>
                <th>Contact</th>
                <th>No of Products Purchased</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let vendor of vendors">
                <td>{{ vendor.id }}</td>
                <td>{{ vendor.name }}</td>
                <td>{{ vendor.gstNo }}</td>
                <td>{{ vendor.address }}</td>
                <td>{{ vendor.contact }}</td>
                <td>{{ vendor.productsPurchased }}</td>
            </tr>
        </tbody>
    </table>

    <!-- Add Vendor Form (Pop-up) -->
    <div class="add-vendor-form" *ngIf="showAddVendorForm">
        <div class="form-container">
            <button class="close-button" (click)="closeAddVendorForm()">
                <span class="material-icons">close</span>
            </button>
            <h2>Add New Vendor</h2>
            <form (ngSubmit)="saveVendor()">
                <div class="form-group">
                    <label>Vendor Name</label>
                    <input type="text" [(ngModel)]="newVendor.name" name="name" required />
                </div>
                <div class="form-group">
                    <label>GST No</label>
                    <input type="text" [(ngModel)]="newVendor.gstNo" name="gstNo" required />
                </div>
                <div class="form-group">
                    <label>Contact</label>
                    <input type="text" [(ngModel)]="newVendor.contact" name="contact" required />
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <textarea [(ngModel)]="newVendor.address" name="address" required></textarea>
                </div>
                <div class="form-group">
                    <label>No of Products Purchased</label>
                    <input type="number" [(ngModel)]="newVendor.productsPurchased" name="productsPurchased" required />
                </div>
                <button type="submit" class="save-button">Save</button>
            </form>
        </div>
    </div>
</div>
