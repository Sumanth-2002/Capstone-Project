spring:
  cloud:
    gateway:
      routes:
        - id: purchase-service
          uri: http://localhost:9092
          predicates:
            - Path=/api/purchase/**
        - id: user-service
          uri: http://localhost:9091
          predicates:
            - Path=/api/users/**
        - id: sale-service
          uri: http://localhost:9090
          predicates:
            - Path=/api/sales/**
        - id: product-service
          uri: http://localhost:9093
          predicates:
            - Path=/api/products/**
        - id: seller-service
          uri: http://localhost:9095
          predicates:
            - Path=/api/seller/**
        - id: store-service
          uri: http://localhost:9094
          predicates:
            - Path=/api/stores/**