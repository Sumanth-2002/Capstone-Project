spring:
  cloud:
    gateway:
      routes:
        - id: store-service
          uri: http://localhost:9092
          predicates:
            - Path=/api/stores/**
        - id: product-service
          uri: http://localhost:9091
          predicates:
            - Path=/api/products/**
        - id: company-service
          uri: http://localhost:9090
          predicates:
            - Path=/api/company/**
        - id: login-service
          uri: http://localhost:9093
          predicates:
            - Path=/api/login/**
        - id: billing-service
          uri: http://localhost:9095
          predicates:
            - Path=/api/billing/**
        - id: vendor-service
          uri: http://localhost:9094
          predicates:
            - Path=/api/vendors/**