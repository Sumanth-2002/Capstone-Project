<!-- Header -->
<app-header></app-header>

<!-- Sidebar -->
<app-sidebar></app-sidebar>

<!-- Main Content -->
<div class="main-content">
    <div class="content-div">
    <!-- Billing Form -->
    <form class="billing-form" (ngSubmit)="onSubmit()">
        <!-- Add Customer Button -->
        <div style="margin-right: 10px;">
            <button type="button" class="add-customer-button" (click)="openCustomerModal()">
                Add Customer
            </button>
        </div>

        <div style="margin-top: 30px;">
            <!-- Customer Details -->
            <div class="form-row">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" [(ngModel)]="billingData.customerName" name="customerName" required  />
                </div>
                <div class="form-group">
                    <label>Contact</label>
                    <input type="text" [(ngModel)]="billingData.contact" name="contact" required />
                </div>
            </div>

            <!-- Store Details -->
            <div class="form-row">
                <div class="form-group">
                    <label>Store ID</label>
                    <input type="text" [(ngModel)]="billingData.storeId" name="storeId" required />
                </div>
                <div class="form-group">
                    <label>Store Name</label>
                    <input type="text" [(ngModel)]="billingData.storeName" name="storeName" required />
                </div>
                <div class="form-group">
                    <label>Sales Rep ID</label>
                    <input type="text" [(ngModel)]="billingData.salesRepId" name="salesRepId" required />
                </div>
                <!-- Plus Button -->
                <div class="plus-button">
                    <button type="button" class="add-sales-rep-button" (click)="openSalesRepModal()">
                        +
                    </button>
                </div>
            </div>

            <!-- Product Details -->
            <div class="form-row" *ngFor="let product of products; let i = index">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" [(ngModel)]="product.productName" name="productName{{i}}" required />
                </div>
                <div class="form-group">
                    <label>Product ID</label>
                    <input type="text" [(ngModel)]="product.productId" name="productId{{i}}" required />
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" [(ngModel)]="product.quantity" name="quantity{{i}}" required style="width: fit-content;" />
                </div>
            </div>

            <!-- Add Product Button -->
            <button type="button" class="add-product-button" (click)="addProduct()">
                Add Product
            </button>

            <!-- Save and Generate Invoice Buttons -->
            <div class="form-buttons">
                <button type="submit" class="save-button">Save</button>
                <button type="button" class="generate-invoice-button" (click)="generateInvoice()">
                    Generate Invoice
                </button>
            </div>
        </div>
    </form>

    <!-- Customer Modal -->
    <div class="modal" *ngIf="isCustomerModalOpen">
        <div class="modal-content">
            <span class="close" (click)="closeCustomerModal()">&times;</span>
            <h2>Add Customer</h2>
            <form (ngSubmit)="saveCustomer()">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" [(ngModel)]="newCustomer.customerName" name="modalCustomerName" required />
                </div>
                <div class="form-group">
                    <label>Contact</label>
                    <input type="text" [(ngModel)]="newCustomer.contact" name="modalContact" required />
                </div>
                <button type="submit" class="save-button">Save</button>
            </form>
        </div>
    </div>
    <!-- Sales Rep Modal -->
    <div class="sales-rep-modal" *ngIf="isSalesRepModalOpen">
        <div class="sales-rep-content">
            <span class="sales-rep-close" (click)="closeSalesRepModal()">&times;</span>
            <h2>Add Sales Rep</h2>
            <form (ngSubmit)="saveSalesRep()">
                <div class="form-group">
                    <label>Sales Rep Name</label>
                    <input type="text" [(ngModel)]="newSalesRep.salesRepName" name="modalSalesRepName" required />
                </div>
                <div class="form-group">
                    <label>Contact</label>
                    <input type="text" [(ngModel)]="newSalesRep.contact" name="modalSalesRepContact" required />
                </div>
                <button type="submit" class="save-button">Save</button>
            </form>
        </div>
    </div>
</div>
</div>
