<!-- Header -->
<app-header></app-header>

<!-- Sidebar -->
<app-sidebar></app-sidebar>

<!-- Main Content -->
<div class="main-content">
    <!-- Search Bar and Add Product Button -->
    <div class="search-add-container">
        <input type="text" class="search-bar" 
        [(ngModel)]="searchTerm"
            (ngModelChange)="onSearch($event)" placeholder="Search Product" />
        <button class="add-product-button" (click)="openAddProductForm()">
            Add New Product
        </button>
    </div>

    <!-- Product Table -->
    <table class="product-table">
        <thead>
            <tr>
              <th>Product ID</th>
              <th>Name</th>
              <th>Vendor Name</th>
              <th>Selling Price</th>
              <th>Cost Price</th>
              <th>Quantity</th>
              <th>Description</th>
              <th>Category</th>

              <!-- <th>Company ID</th> -->
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let product of products">
              <td>{{ product.productId }}</td>
              <td>{{ product.productName }}</td>
              <td>{{ product.vendorName }}</td>
              <td>{{ product.selling_Price }}</td>
              <td>{{ product.cost_Price }}</td>
              <td>{{ product.quantity }}</td>
              <td>{{ product.description }}</td>  <!-- Displaying description -->
              <td>{{ product.category }}</td>  <!-- Displaying category -->
              <!-- <td>{{ product.companyId }}</td>  Displaying company ID -->
            </tr>
          </tbody>
    </table>

    <!-- Add Product Form (Pop-up) -->
    <div class="add-product-form" *ngIf="showAddProductForm">
        <div class="form-container">
            <button class="close-button" (click)="closeAddProductForm()">
                <span class="material-icons">close</span>
            </button>
            <h2>Add New Product</h2>
            <form (ngSubmit)="saveProduct()">
                <div class="form-group">
                    <label>Product Name</label>
                    <input
                        type="text"
                        [(ngModel)]="newProduct.productName"
                        name="productName"
                        required
                    />
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea
                        [(ngModel)]="newProduct.description"
                        name="description"
                        required
                    ></textarea>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input
                        type="text"
                        [(ngModel)]="newProduct.category"
                        name="category"
                        required
                    />
                </div>
                <div class="form-group">
                    <label>Vendor ID</label>
                    <input
                        type="text"
                        [(ngModel)]="newProduct.vendorId"
                        name="vendorId"
                        required
                    />
                </div>
                <div class="form-group">
                    <label>Vendor Name</label>
                    <input
                        type="text"
                        [(ngModel)]="newProduct.vendorName"
                        name="vendorName"
                        required
                    />
                </div>
                <div class="form-group">
                    <label>Cost Price</label>
                    <input
                        type="number"
                        [(ngModel)]="newProduct.cost_Price"
                        name="costPrice"
                        required
                    />
                </div>
                <div class="form-group">
                    <label>Selling Price</label>
                    <input
                        type="number"
                        [(ngModel)]="newProduct.selling_Price"
                        name="sellingPrice"
                        required
                    />
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input
                        type="number"
                        [(ngModel)]="newProduct.quantity"
                        name="quantity"
                        required
                    />
                </div>
                <!-- <div class="form-group">
                    <label>Company ID</label>
                    <input
                        type="text"
                        [(ngModel)]="newProduct.companyId"
                        name="companyId"
                        required
                    />
                </div> -->
                <button type="submit" class="save-button">Save</button>
            </form>
        </div>
    </div>
</div>
