<ng-toast [width]="300" [position]="ToasterPosition.TOP_RIGHT"></ng-toast>

<div class="login-container">

    <!-- Login Form -->
    <form class="login-form" (ngSubmit)="onSubmit()">
        <h2>Login</h2>

        <!-- Role Selection -->
        <div class="form-group">
            <label>Login As</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="role" value="company" [(ngModel)]="loginData.role" required />
                    <span class="radio-custom"></span>
                    Admin
                </label>
                <label class="radio-label">
                    <input type="radio" name="role" value="store" [(ngModel)]="loginData.role" required />
                    <span class="radio-custom"></span>
                    Store
                </label>
            </div>
        </div>

        <!-- ID -->
        <div class="userId">
            <label for="userId">User ID</label>
            <input type="text" id="ID" name="ID" [(ngModel)]="loginData.userId" required />
        </div>

        <!-- Password -->
        <div class="password">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" [(ngModel)]="loginData.password" required />
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-button">Login</button>
    </form>
</div>
